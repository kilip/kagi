[tools]
go = "1.27"
lefthook = "latest"
cocogitto = "latest"
swag = "2.0.0-rc6"
"go:go.uber.org/mock/mockgen" = "0.6.0"

[tasks.test]
description = "Run tests in every workspace module"
run = "for d in $(go list -m -f '{{ '{{.Dir}}' }}'); do (cd \"$d\" && go test ./...) || exit 1; done"

[tasks.vet]
description = "Run go vet in every workspace module"
run = "for d in $(go list -m -f '{{ '{{.Dir}}' }}'); do (cd \"$d\" && go vet ./...) || exit 1; done"

[tasks.fmt]
description = "Format all Go code"
run = "gofmt -w ."

[tasks.mock]
description = "Generate mocks (go.uber.org/mock)"
run = "go generate ./..."

[tasks.openapi]
description = "Generate OpenAPI 3.1 spec from Go comments in http/fiber"
run = "cd http/fiber && swag init --v3.1 -g doc.go -o openapi"
